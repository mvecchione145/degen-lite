server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser never talks to the API container directly,
    # which keeps CORS out of the picture entirely.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # app.js and styles.css are unversioned — no content hash in the filename —
    # so without this the browser heuristically caches them and keeps running
    # the old build after a rebuild. no-cache still allows caching, it just
    # forces a revalidation (ETag) on every load, which is a 304 when unchanged.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
